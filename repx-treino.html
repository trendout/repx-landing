<style>
  :root{
    --black:#0a0a0b; --black2:#131315; --black3:#1b1b1e;
    --line:rgba(255,255,255,0.09); --line-bright:rgba(255,255,255,0.24);
    --ink:#F2F1EE; --dim:#97969b; --dimmer:#5c5b60;
    --red:#9E1B1B; --red-bright:#C2321F;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--black); color:var(--ink);
    font-family:'Inter',sans-serif; min-height:100vh;
  }
  .wrap{ max-width:1200px; margin:0 auto; padding:0 24px; }
  a{ color:inherit; }

  header{ border-bottom:1px solid var(--line); padding:20px 0; }
  header .wrap{ display:flex; align-items:center; justify-content:space-between; }
  .header-right{ display:flex; align-items:center; gap:16px; }
  .logo{ font-family:'Black Ops One',sans-serif; font-size:20px; }
  .header-sub{ font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.08em; color:var(--dim); text-transform:uppercase; }
  .lang-switch{ position:relative; }
  .lang-btn{
    font-family:'Space Mono',monospace; font-size:12px; color:var(--dim);
    background:transparent; border:1px solid var(--line-bright); border-radius:999px;
    padding:7px 12px; cursor:pointer; display:flex; align-items:center; gap:6px;
    transition:color .2s ease, border-color .2s ease;
  }
  .lang-btn:hover{ color:var(--ink); border-color:var(--red-bright); }
  .lang-btn .caret{ font-size:9px; transform:translateY(1px); }
  .lang-menu{
    position:absolute; top:calc(100% + 8px); right:0;
    background:var(--black2); border:1px solid var(--line-bright); border-radius:10px;
    padding:6px; display:none; flex-direction:column; min-width:130px; z-index:60;
    box-shadow:0 12px 30px rgba(0,0,0,0.4);
  }
  .lang-menu.open{ display:flex; }
  .lang-option{
    font-family:'Space Mono',monospace; font-size:12.5px; color:var(--dim);
    background:none; border:none; text-align:left; padding:9px 10px; border-radius:6px;
    cursor:pointer; transition:background .2s ease, color .2s ease;
  }
  .lang-option:hover{ background:rgba(255,255,255,0.06); color:var(--ink); }
  .lang-option.active{ color:var(--ink); background:rgba(194,50,31,0.15); }
  @media (max-width:600px){ .header-sub{ display:none; } }

  .hero-title{ padding:36px 0 8px; }
  .hero-title h1{
    font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase;
    font-size:clamp(24px,4vw,34px); margin:0 0 8px;
  }
  .hero-title p{ color:var(--dim); font-size:14px; margin:0; max-width:560px; line-height:1.6; }

  .app{
    display:grid; grid-template-columns:340px 1fr; gap:28px;
    padding:28px 0 60px; align-items:start;
  }
  @media (max-width:900px){ .app{ grid-template-columns:1fr; } }
  @media (max-width:600px){
    .wrap{ padding:0 16px; }
    .app{ padding:20px 0 40px; gap:20px; }
    .panel{ padding:18px; gap:16px; }
    .hero-title{ padding:24px 0 4px; }
    footer .wrap{ flex-direction:column; gap:6px; text-align:center; }
    .ex-row{ flex-direction:column; gap:3px; }
    .ex-name{ flex-basis:auto; min-width:0; }
    .ex-detail{ text-align:left; flex-basis:auto; }
    .summary h3{ flex-wrap:wrap; gap:4px 10px; }
  }

  .panel{
    background:var(--black2); border:1px solid var(--line); border-radius:14px;
    padding:22px; display:flex; flex-direction:column; gap:20px;
  }
  .group-label{
    font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--dim); margin-bottom:9px;
  }
  .btn-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .pill-btn{
    font-family:'Space Mono',monospace; font-size:11.5px; letter-spacing:.03em;
    padding:9px 14px; border-radius:999px; border:1px solid var(--line-bright);
    background:transparent; color:var(--dim); cursor:pointer; transition:all .2s ease;
  }
  .pill-btn:hover{ color:var(--ink); }
  .pill-btn.active{ background:var(--red); border-color:var(--red); color:#fff; }
  .level-hint{ font-family:'Space Mono',monospace; font-size:11px; color:var(--dimmer); margin-top:8px; }

  .btn{
    font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.05em; text-transform:uppercase;
    padding:13px 18px; border-radius:6px; text-align:center; cursor:pointer; border:none; width:100%;
    transition:all .2s ease; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary{ background:var(--red); color:#fff; }
  .btn-primary:hover{ background:var(--red-bright); }

  .canvas-col{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  .empty{
    width:100%; max-width:560px; border:1px dashed var(--line-bright); border-radius:14px;
    padding:32px 20px; text-align:center; color:var(--dim); font-size:13.5px; background:var(--black2);
  }

  .summary{
    background:var(--black2); border:1px solid var(--line); border-radius:14px;
    padding:20px; width:100%; max-width:560px; animation:cardIn .4s ease-out;
  }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
  .card-meta{
    display:flex; justify-content:space-between; font-family:'Space Mono',monospace;
    font-size:11px; color:var(--dimmer); margin-bottom:10px;
  }
  .summary h3{
    font-family:'Oswald',sans-serif; font-size:17px; text-transform:uppercase; margin:0 0 16px;
    display:flex; justify-content:space-between; align-items:baseline; font-weight:600;
  }
  .card-duration{ font-family:'Space Mono',monospace; font-size:12px; color:var(--red-bright); text-transform:none; }

  .block{ margin-bottom:18px; }
  .block-title{
    font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--dim); margin-bottom:6px;
  }
  .ex-row{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-start; gap:4px 12px; padding:9px 0; border-bottom:1px solid var(--line); }
  .ex-name{ font-family:'Inter',sans-serif; font-size:14px; font-weight:500; color:var(--ink); flex:1 1 55%; min-width:140px; overflow-wrap:break-word; }
  .ex-idx{ font-family:'Space Mono',monospace; font-size:10.5px; color:var(--dimmer); margin-right:8px; }
  .ex-detail{ font-family:'Space Mono',monospace; font-size:12px; color:var(--dim); text-align:right; flex:1 1 auto; min-width:0; overflow-wrap:break-word; }

  .card-note{ font-size:12.5px; color:var(--dim); line-height:1.55; margin:6px 0 0; }

  footer{
    border-top:1px solid var(--line); padding:26px 0; margin-top:0;
    font-family:'Space Mono',monospace; font-size:11px; color:var(--dimmer);
  }
  footer .wrap{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; }

  button:focus-visible, a:focus-visible{ outline:2px solid var(--red-bright); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ .summary{ animation:none !important; } }
</style>

/* ---------- CrossFit / Hyrox movement pools — international CrossFit/Hyrox terminology, same across languages ---------- */
const CF_MOV = {
  agachamento:{ scaled:['Air Squat','Goblet Squat (dumbbell)'], rx:['Back Squat','Front Squat'], rxplus:['Overhead Squat','Heavy Front Squat'] },
  puxada:{ scaled:['Ring Row','Banded Pull-up'], rx:['Strict Pull-up','Kipping Pull-up'], rxplus:['Chest-to-Bar Pull-up','Bar Muscle-up'] },
  empurre:{ scaled:['Knee Push-up','Light Push Press (dumbbells)'], rx:['Push Press','Strict Push-up'], rxplus:['Push Jerk','Handstand Push-up'] },
  dobradica:{ scaled:['Russian KB Swing','Light Romanian Deadlift'], rx:['American KB Swing','Deadlift'], rxplus:['Heavy Clean','Heavy Deadlift'] },
  olimpico:{ scaled:['DB Snatch','DB Clean'], rx:['Power Clean','Power Snatch'], rxplus:['Squat Clean','Squat Snatch'] },
  core:{ scaled:['Sit-up','Hanging Knee Raise'], rx:['Toes-to-Bar','GHD Sit-up'], rxplus:['Unbroken Toes-to-Bar','Legless Rope Climb'] },
  motor:{ scaled:['Run — 400m','Bike — 15 cal','Single-unders x50'], rx:['Row — 15 cal','Run — 400m','Double-unders x40'], rxplus:['Row — 21 cal','Run — 600m','Double-unders x60'] },
};
const HX_STATIONS = {
  ski:{scaled:'Ski Erg — 400m', rx:'Ski Erg — 600m', rxplus:'Ski Erg — 800m'},
  sledPush:{scaled:'Sled Push — 20m', rx:'Sled Push — 25m', rxplus:'Sled Push — 25m'},
  sledPull:{scaled:'Sled Pull — 20m', rx:'Sled Pull — 25m', rxplus:'Sled Pull — 25m'},
  burpee:{scaled:'Burpee Broad Jump x15', rx:'Burpee Broad Jump x25', rxplus:'Burpee Broad Jump x40'},
  row:{scaled:'Row — 400m', rx:'Row — 600m', rxplus:'Row — 800m'},
  farmers:{scaled:'Farmers Carry — 100m', rx:'Farmers Carry — 200m', rxplus:'Farmers Carry — 200m'},
  lunges:{scaled:'Sandbag Lunges — 50m', rx:'Sandbag Lunges — 100m', rxplus:'Sandbag Lunges — 100m'},
  wallball:{scaled:'Wall Balls x30', rx:'Wall Balls x75', rxplus:'Wall Balls x100'},
  run:{scaled:'Run — 400m', rx:'Run — 1km', rxplus:'Run — 1km (strong pace)'},
};

/* ---------- field resolver: turns a ref into display text for a given language ---------- */
function R(field, lang){
  if(field==null) return '—';
  if(typeof field !== 'object') return field; // plain literal (number or language-independent string)
  const C = CONTENT[lang];
  if(field.t==='cal') return C.cal[field.cat][field.level][field.idx];
  if(field.t==='load') return C.loadHints[field.level][field.idx];
  if(field.t==='fw') return C.formatWords[field.key];
  if(field.t==='bw') return typeof C.blockWords[field.key]==='function' ? C.blockWords[field.key](field.n) : C.blockWords[field.key];
  if(field.t==='composite') return field.parts.map(p=>R(p,lang)).join(field.sep||' ');
  return '';
}
function loadField(level){ return {t:'load', level, idx: rndInt(0, LOAD_POOL_SIZE[level]-1)}; }

/* ---------- CrossFit ---------- */
function buildWarmupItems(level){
  return [
    { name:{t:'bw',key:'mobGeral'}, sets:1, reps:'3 min', carga:'—' },
    { name: rnd(CF_MOV.motor[level]), sets:1, reps:{t:'fw',key:'paceEasy'}, carga:'—' },
  ];
}
function buildStrengthItems(level){
  const group = rnd(['agachamento','olimpico','dobradica']);
  const scheme = {scaled:{sets:4,reps:8}, rx:{sets:5,reps:5}, rxplus:{sets:5,reps:3}}[level];
  return [{ name: rnd(CF_MOV[group][level]), sets:scheme.sets, reps:scheme.reps, carga: loadField(level) }];
}
function repsFor(level, kind){
  if(kind==='low') return {scaled:rndInt(5,8), rx:rndInt(3,6), rxplus:rndInt(1,4)}[level];
  return {scaled:rndInt(8,12), rx:rndInt(10,15), rxplus:rndInt(15,21)}[level];
}
function buildCrossfitWod(level){
  const format = rnd(['AMRAP','FOR_TIME','EMOM']);
  if(format==='AMRAP'){
    const duration = {scaled:10, rx:15, rxplus:20}[level];
    const titleField = `AMRAP ${duration} min`;
    const items = [
      { name: rnd(CF_MOV.motor[level]), sets:{t:'fw',key:'perRound'}, reps:'—', carga:{t:'fw',key:'paceSteady'} },
      { name: rnd([...CF_MOV.puxada[level], ...CF_MOV.empurre[level]]), sets:{t:'fw',key:'perRound'}, reps: repsFor(level,'high'), carga: loadField(level) },
      { name: rnd([...CF_MOV.agachamento[level], ...CF_MOV.dobradica[level]]), sets:{t:'fw',key:'perRound'}, reps: repsFor(level,'low'), carga: loadField(level) },
    ];
    return {titleField, items};
  }
  if(format==='FOR_TIME'){
    const scheme = '21-15-9';
    const titleField = `For Time — ${scheme}`;
    const items = [
      { name: rnd(CF_MOV.olimpico[level]), sets:3, reps:scheme, carga: loadField(level) },
      { name: rnd([...CF_MOV.core[level], ...CF_MOV.puxada[level]]), sets:3, reps:scheme, carga: loadField(level) },
      { name: rnd(CF_MOV.motor[level]), sets:3, reps:'—', carga:{t:'fw',key:'paceStrong'} },
    ];
    return {titleField, items};
  }
  const duration = {scaled:10, rx:14, rxplus:18}[level];
  const titleField = `EMOM ${duration} min`;
  const items = [
    { name:{t:'composite', sep:' — ', parts:[{t:'fw',key:'minOdd'}, rnd([...CF_MOV.puxada[level], ...CF_MOV.empurre[level]])]}, sets:`${duration/2} min`, reps: repsFor(level,'high'), carga: loadField(level) },
    { name:{t:'composite', sep:' — ', parts:[{t:'fw',key:'minEven'}, rnd([...CF_MOV.agachamento[level], ...CF_MOV.dobradica[level]])]}, sets:`${duration/2} min`, reps: repsFor(level,'low'), carga: loadField(level) },
  ];
  return {titleField, items};
}
function generateCrossfit(level){
  const wod = buildCrossfitWod(level);
  return { modality:'crossfit', level, blocks:[
    { titleField:{t:'bw',key:'aquecimento'}, items:buildWarmupItems(level) },
    { titleField:{t:'bw',key:'forca'}, items:buildStrengthItems(level) },
    { titleField: wod.titleField, items: wod.items },
  ]};
}

/* ---------- Hyrox ---------- */
function generateHyrox(level){
  const stationKeys = Object.keys(HX_STATIONS).filter(k=>k!=='run');
  const chosen = shuffle(stationKeys).slice(0,3);
  const rounds = {scaled:2, rx:3, rxplus:4}[level];
  const items = [
    { name: HX_STATIONS.run[level], sets: rounds, reps:{t:'fw',key:'perRoundHx'}, carga:{t:'fw',key:'paceHyrox'} },
    ...chosen.map(k=>({ name: HX_STATIONS[k][level], sets: rounds, reps:{t:'fw',key:'perRoundHx'}, carga:{t:'fw',key:'suggestedLoad'} })),
  ];
  return { modality:'hyrox', level, blocks:[
    { titleField:{t:'bw',key:'aquecimento'}, items:[{ name:{t:'bw',key:'mobSki'}, sets:1, reps:'5 min', carga:'—' }] },
    { titleField:{t:'bw',key:'circuito', n:rounds}, items },
    { titleField:{t:'bw',key:'finisher'}, items:[{ name: rnd(['Plank','Dead Bug','Bar Grip Hold']), sets:3, reps: rnd(['40s','12','30s']), carga:'—' }] },
  ]};
}

/* ---------- Calistenia ---------- */
function generateCalistenia(level){
  const scheme = {scaled:{sets:3,reps:10}, rx:{sets:4,reps:8}, rxplus:{sets:5,reps:6}}[level];
  const items = ['push','pull','legs','core'].map(cat=>({
    name:{t:'cal', cat, level, idx: rndInt(0,1)}, sets:scheme.sets, reps:scheme.reps, carga: loadField(level),
  }));
  return { modality:'calistenia', level, blocks:[
    { titleField:{t:'bw',key:'aquecimento'}, items:[{ name:{t:'bw',key:'mobPunhos'}, sets:1, reps:'5 min', carga:'—' }] },
    { titleField:{t:'bw',key:'skill'}, items:[{ name:{t:'cal',cat:'skill',level,idx:rndInt(0,1)}, sets:3, reps:'—', carga:{t:'fw',key:'technicalFocus'} }] },
    { titleField:{t:'bw',key:'circuitoPrincipal'}, items },
  ]};
}

function generatePlan(modality, level){
  if(modality==='crossfit') return generateCrossfit(level);
  if(modality==='hyrox') return generateHyrox(level);
  return generateCalistenia(level);
}

/* ---------- state ---------- */
let modality = 'crossfit';
let level = 'scaled';
let currentLang = 'pt';
let currentPlan = null;
let cardId = rndInt(1000,9999);

const modalityTabs = document.getElementById('modalityTabs');
const levelBadges = document.getElementById('levelBadges');
const generateBtn = document.getElementById('generateBtn');
const planArea = document.getElementById('planArea');
const levelHint = document.getElementById('levelHint');

function esc(str){
  return String(str).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function updateLevelHint(){
  levelHint.textContent = '→ ' + TR[currentLang].levelSub[level];
}

modalityTabs.addEventListener('click', e=>{
  const btn = e.target.closest('.pill-btn');
  if(!btn) return;
  modality = btn.dataset.modality;
  [...modalityTabs.children].forEach(b=>b.classList.toggle('active', b===btn));
});

levelBadges.addEventListener('click', e=>{
  const btn = e.target.closest('.pill-btn');
  if(!btn) return;
  level = btn.dataset.level;
  [...levelBadges.children].forEach(b=>b.classList.toggle('active', b===btn));
  updateLevelHint();
});

generateBtn.addEventListener('click', ()=>{
  currentPlan = generatePlan(modality, level);
  cardId += 1;
  renderPlan();
  generateBtn.textContent = TR[currentLang].generateAgain;
});

function renderBlock(block, idx, lang){
  const rows = block.items.map(item=>`
    <div class="ex-row">
      <span class="ex-name">${esc(R(item.name,lang))}</span>
      <span class="ex-detail">${esc(R(item.sets,lang))}×${esc(R(item.reps,lang))}${ (item.carga && R(item.carga,lang)!=='—') ? ' · '+esc(R(item.carga,lang)) : '' }</span>
    </div>`).join('');
  return `<div class="block"><div class="block-title">${String(idx+1).padStart(2,'0')} — ${esc(R(block.titleField,lang))}</div>${rows}</div>`;
}

function renderPlan(){
  if(!currentPlan){
    planArea.innerHTML = `<div class="empty" data-i18n="empty">${esc(TR[currentLang].empty)}</div>`;
    return;
  }
  const U = TR[currentLang];
  const today = new Date().toLocaleDateString(U.dateLocale, {day:'2-digit', month:'2-digit', year:'numeric'});
  const duration = DURATION[currentPlan.modality][currentPlan.level];
  const modName = { crossfit:U.modCrossfit, hyrox:U.modHyrox, calistenia:U.modCalistenia }[currentPlan.modality];
  const blocksHtml = currentPlan.blocks.map((b,i)=>renderBlock(b,i,currentLang)).join('');
  planArea.innerHTML = `
    <div class="summary">
      <div class="card-meta"><span>${esc(U.cardMeta)} ${cardId}</span><span>${today}</span></div>
      <h3>${esc(modName)} · ${LEVEL_TAG[currentPlan.level]}<span class="card-duration">~${duration} min</span></h3>
      ${blocksHtml}
      <p class="card-note">${esc(CONTENT[currentLang].notes[currentPlan.level])}</p>
    </div>`;
}

/* ---------- language switcher ---------- */
function applyLang(lang){
  currentLang = lang;
  document.documentElement.setAttribute('lang', lang);

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(TR[lang][key] !== undefined) el.textContent = TR[lang][key];
  });

  document.getElementById('langBtnLabel').textContent = lang.toUpperCase();
  document.querySelectorAll('.lang-option').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });

  generateBtn.textContent = currentPlan ? TR[lang].generateAgain : TR[lang].generateBtn;
  updateLevelHint();
  renderPlan();
}

document.getElementById('langBtn').addEventListener('click', e=>{
  e.stopPropagation();
  document.getElementById('langMenu').classList.toggle('open');
});
document.addEventListener('click', ()=> document.getElementById('langMenu').classList.remove('open'));
document.getElementById('langMenu').addEventListener('click', e=>{
  const btn = e.target.closest('.lang-option'); if(!btn) return;
  e.stopPropagation();
  applyLang(btn.dataset.lang);
  document.getElementById('langMenu').classList.remove('open');
});

/* ---------- init ---------- */
updateLevelHint();

</script>
